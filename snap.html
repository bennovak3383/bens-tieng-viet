<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Send a photo · Ben's Tiếng Việt</title>
<style>body{margin:0;background:#0E1030;color:#F6F1E7;font:17px/1.5 system-ui,-apple-system,sans-serif}main{max-width:480px;margin:0 auto;padding:28px 18px;display:flex;flex-direction:column;gap:16px}h1{font:700 28px Georgia,serif;margin:0}p{margin:0;color:#BDBBDD}.btn{font:inherit;font-weight:700;color:#fff;border:0;border-radius:14px;padding:18px;min-height:64px;width:100%;background:linear-gradient(120deg,#FF8A3D,#FF4D7E)}.btn.b{background:#191C47;border:1px solid #363B80}input[type=text]{font:700 24px ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;width:100%;box-sizing:border-box;padding:14px;border-radius:12px;border:1px solid #363B80;background:#191C47;color:#fff;text-align:center}img{width:100%;border-radius:12px}.ok{color:#57D9A3;font-weight:700}.err{color:#FF7A8A;font-weight:700}</style></head>
<body><main id="app"></main>
<script>
(function(){ var app=document.getElementById('app'), T=(new URLSearchParams(location.search).get('t')||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
function h(t,a,k){ var e=document.createElement(t); a=a||{}; for(var n in a){ if(n==='text') e.textContent=a[n]; else if(n==='class') e.className=a[n]; else if(n.slice(0,2)==='on') e.addEventListener(n.slice(2),a[n]); else if(a[n]!=null&&a[n]!==false) e.setAttribute(n,a[n]) } (k||[]).forEach(function(c){ if(c) e.appendChild(c) }); return e }
function shrink(file,cb){ var r=new FileReader(); r.onload=function(){ var img=new Image(); img.onload=function(){ var M=1600, sc=Math.min(1,M/Math.max(img.width,img.height)), c=document.createElement('canvas'); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc); c.getContext('2d').drawImage(img,0,0,c.width,c.height); var q=.8, d=c.toDataURL('image/jpeg',q); while(d.length>1400000&&q>.35){ q-=.1; d=c.toDataURL('image/jpeg',q) } cb(d) }; img.onerror=function(){ cb('') }; img.src=r.result }; r.onerror=function(){ cb('') }; r.readAsDataURL(file) }
function ask(){ app.innerHTML=''; var inp=h('input',{type:'text',placeholder:'XXXXX-XXXXX',autocapitalize:'characters',autocomplete:'off'}); app.appendChild(h('h1',{text:'Send a photo to your laptop'})); app.appendChild(h('p',{text:'Type the code shown on the laptop.'})); app.appendChild(inp); app.appendChild(h('button',{class:'btn',text:'Next',onclick:function(){ var v=inp.value.toUpperCase().replace(/[^A-Z0-9]/g,''); if(v.length>=10){ T=v; go() } }})) }
function go(){ app.innerHTML=''; var inp=h('input',{type:'file',accept:'image/*',capture:'environment',hidden:'hidden'}), msg=h('p',{text:'Lay the page flat in good light and fill the picture with it.'}), prev=h('div',{});
  inp.addEventListener('change',function(){ var f=inp.files&&inp.files[0]; if(!f) return; msg.className=''; msg.textContent='Sending…'; shrink(f,function(d){ if(!d){ msg.className='err'; msg.textContent='Could not read that photo. Try again.'; return } prev.innerHTML=''; prev.appendChild(h('img',{src:d,alt:'Your page'}));
    fetch('/api/snap?t='+T,{method:'POST',headers:{'Content-Type':'text/plain'},body:d}).then(function(r){ return r.json().then(function(j){ if(!r.ok) throw new Error(j.error||'Error'); msg.className='ok'; msg.textContent='Sent. Look at your laptop. You can close this page.' }) }).catch(function(e){ msg.className='err'; msg.textContent='Not sent: '+e.message }) }) });
  app.appendChild(h('h1',{text:'Photo of your page'})); app.appendChild(msg); app.appendChild(inp); app.appendChild(h('button',{class:'btn',text:'Take the photo',onclick:function(){ inp.click() }})); app.appendChild(prev) }
if(T.length>=10) go(); else ask(); })();
</script></body></html>
