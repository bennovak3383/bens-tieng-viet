<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex"><title>Thu âm · Recording</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap">
<style>
:root{--bg:#F3EADB;--surface:#FBF4E6;--ink:#2B1D14;--muted:#6A5544;--line:#CDBFA6;--green:#1F5A45;--sun:#E8B23A;--red:#B5432B}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 "Be Vietnam Pro",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:560px;margin:0 auto;padding:20px 16px calc(40px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
h1{font:700 30px/1.15 "Playfair Display",Georgia,serif;margin:0}h2{font:700 21px "Playfair Display",Georgia,serif;margin:0}
p{margin:0}.muted{color:var(--muted)}.small{font-size:14px}
.panel{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:1.5px solid var(--ink);background:var(--surface);border-radius:8px;padding:12px 16px;font-weight:600;min-height:52px;width:100%}
.btn.primary{background:var(--green);color:#FBF4E6;box-shadow:3px 3px 0 var(--ink)}
.btn.rec{background:var(--red);color:#fff;box-shadow:3px 3px 0 var(--ink);min-height:84px;font-size:20px}
.btn.rec.on{background:#fff;color:var(--red);border-color:var(--red)}
.btn:disabled{opacity:.5}
.part{display:flex;align-items:center;gap:12px;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;width:100%}
.part b{display:block}.part .n{margin-left:auto;font-weight:600;white-space:nowrap}
.part.done{border-color:var(--green)}.part.done .n{color:var(--green)}
.bar{height:6px;border-radius:3px;background:#E6D9BE;overflow:hidden}.bar i{display:block;height:100%;background:var(--green)}
.line{font:700 30px/1.3 "Be Vietnam Pro",sans-serif;text-align:center;padding:10px 0}
.row{display:flex;gap:10px}.row .btn{flex:1}
.x{border:0;background:none;padding:6px 0;font-weight:600;color:var(--muted);text-align:left}
audio{width:100%}ol{margin:0;padding-left:20px}li{margin:4px 0}
.err{color:var(--red);font-weight:600}
textarea{width:100%;font:inherit;padding:10px;border:1.5px solid var(--line);border-radius:8px;background:#fff}
</style></head>
<body><main id="app"><p class="muted">Đang tải…</p></main>
<script>
(function(){
var app=document.getElementById('app'), Q=new URLSearchParams(location.search), KEY=Q.get('v')||'', WHO=(Q.get('who')||'voice1').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,12)||'voice1';
try{ if(KEY) localStorage.setItem('bensvn.voicekey',KEY); else KEY=localStorage.getItem('bensvn.voicekey')||'' }catch(e){}
var PARTS=[], DONE={}, PRE={}, stream=null, AC=null;
function h(t,a,k){ var e=document.createElement(t); a=a||{}; for(var n in a){ if(n==='text') e.textContent=a[n]; else if(n==='class') e.className=a[n]; else if(n.slice(0,2)==='on') e.addEventListener(n.slice(2),a[n]); else if(a[n]!=null&&a[n]!==false) e.setAttribute(n,a[n]) } (k||[]).forEach(function(c){ if(c) e.appendChild(c) }); return e }
function api(p,o){ o=o||{}; o.headers=Object.assign({'X-Voice':KEY},o.headers||{}); return fetch('/api/'+p+(p.indexOf('?')<0?'?':'&')+'who='+WHO,o).then(function(r){ return r.json().then(function(j){ if(!r.ok) throw new Error(j.error||'Lỗi'); return j }) }) }
function isDone(l){ return !!(DONE[l.id]||PRE[l.vi]) }
function left(p){ return p.lines.filter(function(l){ return !isDone(l) }).length }

function home(){ app.innerHTML=''; var total=0, done=0; PARTS.forEach(function(p){ total+=p.lines.length; done+=p.lines.length-left(p) });
  app.appendChild(h('h1',{text:'Thu âm cho app học tiếng Việt'}));
  app.appendChild(h('p',{class:'muted',text:'Cảm ơn bạn! Giọng của bạn sẽ giúp người nước ngoài học tiếng Việt giọng Sài Gòn.'}));
  app.appendChild(h('div',{class:'panel'},[h('h2',{text:'Cách thu'}),h('ol',{},[
    h('li',{text:'Ngồi ở phòng yên tĩnh. Tắt quạt, máy lạnh, tivi nếu được.'}),
    h('li',{text:'Để điện thoại cách miệng khoảng 20 cm.'}),
    h('li',{text:'Bấm nút đỏ, đọc câu trên màn hình, rồi bấm lần nữa để dừng.'}),
    h('li',{text:'Nói tự nhiên, tốc độ bình thường, như đang nói chuyện với bạn. Không cần đọc chậm.'}),
    h('li',{text:'Nghe lại. Nếu được thì bấm “Lưu và tiếp”. Chưa được thì bấm “Thu lại”.'}),
    h('li',{text:'Câu nào người Sài Gòn không nói như vậy thì bấm “Câu này không tự nhiên”.'})]),
    h('p',{class:'small muted',text:'In English: quiet room, phone 20 cm away, tap the red button, read the line, tap again to stop. Speak naturally at normal speed. Listen, then save or redo. You can stop any time. Your progress is saved.'})]));
  app.appendChild(h('div',{class:'panel'},[h('b',{text:'Đã thu '+done+' / '+total+' câu'}),h('div',{class:'bar'},[h('i',{style:'width:'+Math.round(done/Math.max(1,total)*100)+'%'})])]));
  var next=PARTS.filter(function(p){ return left(p) })[0];
  if(next) app.appendChild(h('button',{class:'btn primary',text:'Thu tiếp · '+next.vi,onclick:function(){ part(next) }}));
  app.appendChild(h('h2',{text:'Các phần'}));
  PARTS.forEach(function(p){ var l=left(p); app.appendChild(h('button',{class:'part'+(l?'':' done'),onclick:function(){ part(p) }},[h('div',{},[h('b',{text:p.vi}),h('span',{class:'small muted',text:p.en})]),h('span',{class:'n',text:l?(p.lines.length-l)+' / '+p.lines.length:'Xong'})])) }) }

function mic(){ if(stream&&stream.getAudioTracks().some(function(t){ return t.readyState==='live' })) return Promise.resolve(stream); return navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:true,autoGainControl:true}}).then(function(s){ stream=s; return s }) }
function micOff(){ try{ if(stream) stream.getTracks().forEach(function(t){ t.stop() }) }catch(e){} stream=null }
/* trim the silence, even out the loudness, save as a small WAV that every phone can play */
function toWav(blob){ return blob.arrayBuffer().then(function(ab){ if(!AC){ var C=window.AudioContext||window.webkitAudioContext; AC=new C() } return new Promise(function(res,rej){ var p=AC.decodeAudioData(ab,res,rej); if(p&&p.catch) p.catch(rej) }) }).then(function(buf){
    var src=buf.getChannelData(0), sr=buf.sampleRate, hop=Math.round(sr*0.01), n=Math.floor(src.length/hop), e=new Float32Array(n), pk=0, i, j;
    for(i=0;i<n;i++){ var s=0; for(j=0;j<hop;j++){ var v=src[i*hop+j]; s+=v*v } e[i]=Math.sqrt(s/hop); if(e[i]>pk) pk=e[i] }
    var thr=Math.max(0.006,pk*0.08), a=0, b=n-1; while(a<n&&e[a]<thr) a++; while(b>a&&e[b]<thr) b--; if(b-a<12) throw new Error('quiet');
    var s0=Math.max(0,a*hop-Math.round(sr*0.10)), s1=Math.min(src.length,(b+1)*hop+Math.round(sr*0.16)), OSR=22050, len=Math.round((s1-s0)*OSR/sr), out=new Float32Array(len), sum=0;
    for(i=0;i<len;i++){ var x=s0+i*sr/OSR, k=Math.floor(x), f=x-k; out[i]=(src[k]||0)*(1-f)+(src[k+1]||0)*f; sum+=out[i]*out[i] }
    var g=Math.min(0.11/Math.max(Math.sqrt(sum/len),1e-5),8), fade=Math.round(OSR*0.02), w=new DataView(new ArrayBuffer(44+len*2));
    function str(o,t){ for(var q=0;q<t.length;q++) w.setUint8(o+q,t.charCodeAt(q)) }
    str(0,'RIFF'); w.setUint32(4,36+len*2,true); str(8,'WAVEfmt '); w.setUint32(16,16,true); w.setUint16(20,1,true); w.setUint16(22,1,true); w.setUint32(24,OSR,true); w.setUint32(28,OSR*2,true); w.setUint16(32,2,true); w.setUint16(34,16,true); str(36,'data'); w.setUint32(40,len*2,true);
    for(i=0;i<len;i++){ var y=Math.tanh(out[i]*g*1.15)/1.15; if(i<fade) y*=i/fade; if(len-i<fade) y*=(len-i)/fade; w.setInt16(44+i*2,Math.max(-1,Math.min(1,y))*32767,true) }
    return {blob:new Blob([w.buffer],{type:'audio/wav'}),sec:len/OSR} }) }

function part(p){ var idx=p.lines.findIndex(function(l){ return !isDone(l) }); if(idx<0) idx=0; line(p,idx) }
function line(p,i){ if(i>=p.lines.length){ micOff(); return home() } var l=p.lines[i], mr=null, chunks=[], wav=null, t0=0;
  app.innerHTML=''; var msg=h('p',{class:'small muted',style:'text-align:center',text:isDone(l)?'Câu này đã thu rồi. Bạn có thể thu lại.':'Bấm nút đỏ rồi đọc câu này.'}), player=h('div',{}), rec=h('button',{class:'btn rec',text:'● Thu'}), save=h('button',{class:'btn primary',text:'Lưu và tiếp',disabled:'disabled'}), flagBox=h('div',{});
  function go(n){ try{ if(mr&&mr.state!=='inactive'){ mr.onstop=null; mr.stop() } }catch(e){} line(p,n) }
  rec.onclick=function(){ if(mr&&mr.state==='recording'){ rec.disabled=true; mr.stop(); return }
    mic().then(function(s){ chunks=[]; wav=null; save.disabled=true; player.innerHTML=''; mr=new MediaRecorder(s); mr.ondataavailable=function(e){ if(e.data&&e.data.size) chunks.push(e.data) };
      mr.onstop=function(){ rec.classList.remove('on'); rec.textContent='● Thu lại'; rec.disabled=false; if(Date.now()-t0<350){ msg.textContent='Ngắn quá. Bấm thu, đọc câu, rồi bấm dừng.'; return } msg.textContent='Đang xử lý…';
        toWav(new Blob(chunks,{type:mr.mimeType||'audio/webm'})).then(function(r){ wav=r.blob; var a=h('audio',{controls:'controls'}); a.src=URL.createObjectURL(wav); player.innerHTML=''; player.appendChild(a); try{ a.play() }catch(e){} save.disabled=false; msg.textContent='Nghe lại. Được thì bấm “Lưu và tiếp”.' }).catch(function(){ msg.textContent='Không nghe thấy tiếng. Thử lại gần điện thoại hơn.'; msg.className='small err' }) };
      mr.start(); t0=Date.now(); rec.classList.add('on'); rec.textContent='■ Dừng'; msg.className='small muted'; msg.textContent='Đang thu… đọc câu rồi bấm dừng.' }).catch(function(){ msg.className='small err'; msg.textContent='Không mở được micro. Vào Cài đặt của trình duyệt và cho phép micro.' }) };
  save.onclick=function(){ if(!wav) return; save.disabled=true; msg.textContent='Đang lưu…'; api('voice/rec?id='+l.id,{method:'POST',headers:{'Content-Type':'audio/wav','X-Text':encodeURIComponent(l.vi)},body:wav}).then(function(j){ DONE[l.id]=[j.t,l.vi]; var n=p.lines.findIndex(function(x,k){ return k>i&&!isDone(x) }); go(n<0?p.lines.length:n) }).catch(function(e){ save.disabled=false; msg.className='small err'; msg.textContent='Chưa lưu được: '+e.message+'. Kiểm tra mạng rồi bấm lại.' }) };
  app.appendChild(h('button',{class:'x',text:'‹ Tất cả các phần',onclick:function(){ go(p.lines.length) }}));
  app.appendChild(h('div',{},[h('div',{class:'small muted',text:p.vi+' · câu '+(i+1)+' / '+p.lines.length}),h('div',{class:'bar',style:'margin-top:6px'},[h('i',{style:'width:'+Math.round((p.lines.length-left(p))/p.lines.length*100)+'%'})])]));
  app.appendChild(h('div',{class:'panel'},[h('div',{class:'line',text:l.vi}),l.en?h('p',{class:'small muted',style:'text-align:center',text:l.en}):null]));
  if(l.note) app.appendChild(h('div',{class:'panel',style:'background:#F3DFA6;border-color:#2B1D14'},[h('p',{class:'small',text:l.note})]));
  app.appendChild(rec); app.appendChild(msg); app.appendChild(player); app.appendChild(save);
  app.appendChild(h('div',{class:'row'},[h('button',{class:'btn',text:'‹ Câu trước',disabled:i?null:'disabled',onclick:function(){ go(i-1) }}),h('button',{class:'btn',text:'Bỏ qua ›',onclick:function(){ go(i+1) }})]));
  app.appendChild(h('button',{class:'x',text:'Câu này không tự nhiên · this line is not natural',onclick:function(){ var ta=h('textarea',{rows:'2',placeholder:'Người Sài Gòn nói sao? (không bắt buộc)'}); flagBox.innerHTML=''; flagBox.appendChild(h('div',{class:'panel'},[ta,h('button',{class:'btn',text:'Gửi ghi chú',onclick:function(ev){ ev.target.disabled=true; api('voice/flag?id='+l.id,{method:'POST',headers:{'Content-Type':'application/json','X-Text':encodeURIComponent(l.vi)},body:JSON.stringify({note:ta.value})}).then(function(){ flagBox.innerHTML=''; flagBox.appendChild(h('p',{class:'small muted',text:'Đã gửi. Cảm ơn bạn!'})) }).catch(function(){ ev.target.disabled=false }) }})])) }}));
  app.appendChild(flagBox) }

if(!KEY){ app.innerHTML=''; app.appendChild(h('h1',{text:'Thu âm'})); app.appendChild(h('p',{class:'err',text:'Link này thiếu mã. Hãy mở đúng link mà Ben gửi. · This link is missing its key. Open the exact link Ben sent.'})); return }
if(!navigator.mediaDevices||!window.MediaRecorder){ app.innerHTML=''; app.appendChild(h('p',{class:'err',text:'Trình duyệt này không thu âm được. Hãy mở link bằng Safari (iPhone) hoặc Chrome (Android).'})); return }
Promise.all([fetch('data/voice-lines.json').then(function(r){ return r.json() }),api('voice/mine'),fetch('audio/index.json').then(function(r){ return r.json() }).catch(function(){ return {clips:{}} })]).then(function(R){
  PARTS=R[0].parts; DONE=R[1].done||{}; if(WHO==='voice1'){ var c=R[2].clips||{}; Object.keys(c).forEach(function(t){ if(c[t].some(function(x){ return x[3]===2 })) PRE[t]=1 }) } home()
}).catch(function(e){ app.innerHTML=''; app.appendChild(h('h1',{text:'Thu âm'})); app.appendChild(h('p',{class:'err',text:(e.message||'Lỗi')+' · Hãy mở đúng link mà Ben gửi.'})) });
})();
</script></body></html>
