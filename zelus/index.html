<style>
/* Layout idea: one-column phone app. Deep graphite ground with a soft blue glow, glass cards, one blue accent for action and worked muscle. Single theme by choice. */
:root{
  color-scheme:dark;
  --bg:#0d0f13; --surface:#181b21; --surface2:#232732; --line:rgba(255,255,255,.085);
  --text:#eef1f6; --muted:#98a2b4; --accent:#5a97ff; --accent2:#3ccbff; --accent-ink:#051022; --accent-soft:rgba(90,151,255,.16);
  --muscle:#353b47; --sil:#252932;
  --good:#3ecf8e; --warn:#f0b34a; --danger:#f2707a;
  --display:'Sora',system-ui,sans-serif; --body:'Albert Sans',system-ui,-apple-system,sans-serif;
  --r:20px; --grad:linear-gradient(135deg,#7fb2ff,#4f8dff);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(820px 420px at 85% -8%,rgba(90,151,255,.2),transparent 62%),radial-gradient(620px 360px at -12% 6%,rgba(60,203,255,.09),transparent 60%),var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
#shell{height:100%;max-width:540px;margin:0 auto;display:flex;flex-direction:column;position:relative}
#app{flex:1;overflow-y:auto;padding:20px 16px 28px;display:flex;flex-direction:column;gap:14px;scrollbar-width:none}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.02em}
h1{font-size:28px;font-weight:700} h2{font-size:17px;font-weight:600} h3{font-size:14px;font-weight:600}
.kicker{font-family:var(--body);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
.accent{color:var(--accent)} .good{color:var(--good)} .warn{color:var(--warn)} .bad{color:var(--danger)}
.card{background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.022));border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:11px;box-shadow:0 18px 40px -28px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.04)}
.card.hero{background:linear-gradient(150deg,rgba(90,151,255,.26),rgba(60,203,255,.06) 58%,rgba(255,255,255,.02));border-color:rgba(90,151,255,.38)}
.row{display:flex;align-items:center;gap:10px} .between{justify-content:space-between} .wrap{flex-wrap:wrap} .col{display:flex;flex-direction:column;gap:8px} .grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px} .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
button{font:inherit;color:inherit;cursor:pointer} button[disabled]{opacity:.35;cursor:default}
.btn{min-height:46px;padding:0 16px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--text);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s,background .15s}
.btn.primary{background:var(--grad);border-color:transparent;color:var(--accent-ink);box-shadow:0 10px 24px -12px rgba(90,151,255,.9)}
.btn.ghost{background:transparent} .btn.danger{color:var(--danger)} .btn.block{width:100%} .btn.sm{min-height:38px;padding:0 13px;font-size:14px;border-radius:12px}
.btn:active{transform:scale(.97)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{flex:none;min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--muted);font-size:14px;font-weight:500}
.chip.on{background:var(--accent-soft);border-color:rgba(90,151,255,.7);color:var(--text)}
.tile{background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:16px;padding:13px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile .v{font-family:var(--display);font-size:21px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tile .k{font-size:12px;color:var(--muted)}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%;min-height:54px}
.item:last-child{border-bottom:0}
.badge{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:.03em;background:var(--accent-soft);color:#9cc0ff}
.badge.pr{background:rgba(240,179,74,.16);color:var(--warn)} .badge.ok{background:rgba(62,207,142,.14);color:var(--good)}
input,select,textarea{font:inherit;color:var(--text);background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:12px;min-height:46px;padding:0 12px;width:100%}
textarea{padding:10px 12px;min-height:72px;resize:vertical}
input::placeholder,textarea::placeholder{color:#6f7888}
input[type=file]{padding:10px 12px;font-size:13px}
label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
#nav{display:grid;grid-template-columns:repeat(5,1fr);margin:0 12px 12px;border-radius:24px;background:rgba(24,27,34,.82);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--line);box-shadow:0 18px 40px -18px #000}
#nav button{background:none;border:0;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);font-size:11px;font-weight:500}
#nav button.on{color:var(--text)}
#nav button.on svg{stroke:var(--accent);filter:drop-shadow(0 0 7px rgba(90,151,255,.85))}
#nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#resume{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 12px 8px;padding:12px 16px;background:linear-gradient(135deg,rgba(90,151,255,.3),rgba(60,203,255,.12));border:1px solid rgba(90,151,255,.5);border-radius:16px;text-align:left}
.top{display:flex;align-items:center;gap:10px;min-height:46px}
.back{width:46px;height:46px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;flex:none}
.back svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.setgrid{display:grid;grid-template-columns:40px minmax(0,1fr) 74px 60px 46px;gap:6px;align-items:center}
.setgrid input{padding:0 6px;text-align:center;min-height:44px;font-variant-numeric:tabular-nums;font-weight:600}
.settype{height:44px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.05);font-weight:600;font-family:var(--display);font-size:14px}
.settype.W{color:var(--warn)} .settype.D{color:var(--accent2)} .settype.F{color:var(--danger)}
.check{height:44px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;transition:background .15s}
.check svg{width:18px;height:18px;fill:none;stroke:var(--muted);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.setrow.done .check{background:var(--grad);border-color:transparent;box-shadow:0 6px 16px -8px rgba(90,151,255,.9)} .setrow.done .check svg{stroke:var(--accent-ink)}
.setrow.done input{background:var(--accent-soft);border-color:transparent}
.bar{height:8px;border-radius:999px;background:rgba(255,255,255,.07);overflow:hidden} .bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:999px}
#timer{position:sticky;bottom:0;margin:0 -4px -16px;padding:12px 14px;background:rgba(24,27,34,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(90,151,255,.55);border-radius:18px;display:flex;align-items:center;gap:10px;box-shadow:0 14px 30px -14px #000}
#sheetwrap{position:absolute;inset:0;background:rgba(4,6,9,.7);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:none;align-items:flex-end;z-index:5}
#sheetwrap.on{display:flex}
#sheet{width:100%;max-height:90%;overflow-y:auto;background:#191c23;border-top:1px solid var(--line);border-radius:26px 26px 0 0;padding:20px 16px 24px;display:flex;flex-direction:column;gap:12px;animation:up .22s ease-out}
.ring{--p:0;width:84px;height:84px;border-radius:50%;background:conic-gradient(var(--accent2),var(--accent) calc(var(--p)*1%),rgba(255,255,255,.08) 0);display:flex;align-items:center;justify-content:center;flex:none}
.ring>div{width:66px;height:66px;border-radius:50%;background:#171a21;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:600;font-size:16px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:12px}
.cal span{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:10px;color:var(--muted)}
.cal span.on{background:var(--grad);color:var(--accent-ink);font-weight:600} .cal span.today{outline:1px solid var(--accent)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)} .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums} td,th{padding:8px 4px;text-align:left;border-bottom:1px solid var(--line)} th{color:var(--muted);font-weight:500;font-size:12px}
.toast{position:absolute;left:16px;right:16px;bottom:92px;background:#262b36;border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px;z-index:6;text-align:center;box-shadow:0 14px 30px -12px #000}
.hide{display:none!important}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;background:radial-gradient(40% 30% at 78% 8%,rgba(90,151,255,.24),transparent 70%),radial-gradient(34% 26% at 8% 18%,rgba(60,203,255,.13),transparent 70%),radial-gradient(42% 30% at 60% 100%,rgba(122,108,255,.12),transparent 70%);animation:drift 26s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(-3%,2%,0) scale(1.07)}}
#app{padding-top:max(20px,env(safe-area-inset-top))}
#nav{margin-bottom:max(12px,env(safe-area-inset-bottom))}
h1{background:linear-gradient(110deg,#ffffff 30%,#9fc4ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .num{background:linear-gradient(110deg,#ffffff,#a8c9ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.card{position:relative;overflow:hidden}
#app>*{flex-shrink:0}
.card.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(90,151,255,.35),transparent 70%);pointer-events:none}
.thumb{width:48px;height:48px;border-radius:15px;background:radial-gradient(circle at 50% 28%,#2c3344,#161920);border:1px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;overflow:hidden}
.thumb svg{width:44px;height:44px}
.ringsvg{flex:none;filter:drop-shadow(0 0 10px rgba(90,151,255,.45))}
.enter .ringarc{animation:ringin 1.1s cubic-bezier(.2,.7,.2,1) both}
@keyframes ringin{from{stroke-dashoffset:var(--c)}}
.draw{stroke-dasharray:1;stroke-dashoffset:0}
.enter .draw{animation:draw 1.3s ease-out both}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.setrow.done .check{animation:pop .3s}
@keyframes pop{50%{transform:scale(1.2)}}
#sheet::before{content:"";width:42px;height:4px;border-radius:2px;background:rgba(255,255,255,.2);align-self:center;flex:none}
.tile{background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.02))}
.item{transition:background .15s}.item:active{background:rgba(255,255,255,.04)}
.code{font-family:var(--display);font-size:24px;font-weight:600;letter-spacing:.08em;text-align:center;padding:16px;border-radius:16px;background:rgba(0,0,0,.3);border:1px dashed rgba(90,151,255,.6);user-select:all}
#nav .fab span{width:52px;height:52px;border-radius:18px;background:var(--grad);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px -8px rgba(90,151,255,.95)}
#nav .fab svg{stroke:var(--accent-ink);stroke-width:2.4;width:24px;height:24px}
.prev{background:none;border:1px dashed var(--line);border-radius:10px;min-height:44px;color:var(--muted);font-size:13px;padding:0 6px;text-align:left}
.dot{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none}
.dot.on{background:var(--grad);border-color:transparent}.dot svg{width:14px;height:14px;fill:none;stroke:var(--accent-ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
#app.enter>*{animation:rise .34s cubic-bezier(.2,.7,.2,1) both}
#app.enter>*:nth-child(2){animation-delay:.04s}#app.enter>*:nth-child(3){animation-delay:.08s}#app.enter>*:nth-child(4){animation-delay:.12s}#app.enter>*:nth-child(n+5){animation-delay:.16s}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

  const metric={rm:['Estimated 1RM',s=>s.rm],top:['Heaviest set',s=>s.top],vol:['Session volume',s=>s.vol]};
  const mk=CARDIO[ex.id]?'top':exMetric;const pts=ss.map(s=>({l:fmtShort(s.t),v:metric[mk][1](s)*(CARDIO[ex.id]||unit()!=='kg'?1:1/KG)}));
  let h='<div class="top">'+backBtn+'<div class="grow"><h1>'+esc(ex.name)+'</h1><div class="muted small">'+EQ[ex.eq]+'</div></div></div>';
  h+='<div class="card">'+bodySVG(exLevels(ex),290)+'<div class="legend"><span><i style="background:rgba(76,141,255,1)"></i>Primary: '+(ex.p.map(m=>MUS[m]).join(', ')||'none')+'</span></div>'+(ex.s.length?'<div class="legend"><span><i style="background:rgba(76,141,255,.5)"></i>Secondary: '+ex.s.map(m=>MUS[m]).join(', ')+'</span></div>':'')+'</div>';
  h+='<div class="card"><h3 class="kicker">Movement</h3>'+moveSVG(ex)+'</div>';
  h+=CARDIO[ex.id]?'<div class="grid3"><div class="tile"><div class="v">'+dv(ex.id,b.top)+' '+du(ex.id)+'</div><div class="k">Longest distance</div></div><div class="tile"><div class="v">'+b.reps+' min</div><div class="k">Longest bout</div></div><div class="tile"><div class="v">'+ss.length+'</div><div class="k">Sessions</div></div></div>':'<div class="grid2"><div class="tile"><div class="v">'+(b.rm?disp(b.rm)+' '+unit():'–')+'</div><div class="k">Best estimated 1RM</div></div><div class="tile"><div class="v">'+(b.top?disp(b.top)+' '+unit():'–')+'</div><div class="k">Heaviest weight</div></div><div class="tile"><div class="v">'+(b.vol?big(b.vol)+' '+unit():'–')+'</div><div class="k">Best session volume</div></div><div class="tile"><div class="v">'+ss.length+'</div><div class="k">Sessions logged</div></div></div>';
  h+='<div class="card">'+(CARDIO[ex.id]?'<h2>Distance per session</h2>':'<div class="chips">'+Object.keys(metric).map(k=>'<button class="chip'+(exMetric===k?' on':'')+'" data-a="exMetric" data-id="'+k+'">'+metric[k][0]+'</button>').join('')+'</div>')+lineChart(pts,x=>Math.round(x).toLocaleString('en-US'))+(ss.length>1?'<div class="muted small">'+(CARDIO[ex.id]?'Distance':metric[mk][0])+' is '+(function(){const c=pctChange(pts[pts.length-1].v,pts[0].v);return c==null?'unchanged':(c>=0?'up ':'down ')+Math.abs(c)+'%'})()+' since your first logged session.</div>':'')+'</div>';
  if(b.rm>0&&!CARDIO[ex.id]){h+='<div class="card"><h2>Working weights from your 1RM</h2><table><tr><th>% of 1RM</th><th>Weight</th><th>Typical reps</th></tr>'+[[95,2],[90,4],[85,6],[80,8],[75,10],[70,12],[60,15]].map(r=>'<tr><td>'+r[0]+'%</td><td>'+disp(roundInc(b.rm*r[0]/100))+' '+unit()+'</td><td>'+r[1]+'</td></tr>').join('')+'</table></div>'}
  if(ss.length)h+='<div class="card"><h2>History</h2><div class="list">'+ss.slice(-8).reverse().map(s=>'<button class="item" data-a="open" data-v="workoutDetail" data-id="'+s.wid+'"><div class="grow"><div style="font-weight:600">'+fmtDate(s.t)+'</div><div class="muted small">'+s.sets.map(x=>dv(ex.id,x.w)+'×'+x.r).join('  ')+'</div></div></button>').join('')+'</div></div>';
  if(ex.custom)h+='<button class="btn danger" data-a="delEx" data-id="'+ex.id+'">Delete custom exercise</button>';
  return h;
};

    e.sets.forEach((s,si)=>{const isW=s.t==='W';const idx=isW?-1:k++;const pv=!isW&&last?(last.sets[idx]||last.sets[last.sets.length-1]):null;let ph=isW?null:(sg||(pv?{w:pv.w,r:pv.r}:null));if(!isW&&e.rl&&e.rl[idx])ph={w:ph?ph.w:'',r:e.rl[idx]};

V.progress=()=>{
  const st=periodStats(period),c=st.cur,p=st.prev;const ch=(a,b)=>{if(!st.hasPrev)return '';const x=pctChange(a,b);return x==null?'':' <span class="'+(x>=0?'good':'bad')+' tiny">'+(x>=0?'+':'')+x+'%</span>'};
  let h='<h1>Progress</h1><div class="chips">'+[[7,'7 days'],[30,'30 days'],[90,'90 days'],[365,'1 year'],[0,'All time']].map(x=>'<button class="chip'+(period===x[0]?' on':'')+'" data-a="period" data-id="'+x[0]+'">'+x[1]+'</button>').join('')+'</div>';
  h+='<div class="grid2"><div class="tile"><div class="v">'+c.n+ch(c.n,p.n)+'</div><div class="k">Workouts</div></div><div class="tile"><div class="v">'+big(c.vol)+ch(c.vol,p.vol)+'</div><div class="k">Volume, '+unit()+'</div></div><div class="tile"><div class="v">'+c.sets+ch(c.sets,p.sets)+'</div><div class="k">Working sets</div></div><div class="tile"><div class="v">'+dur(c.time)+ch(c.time,p.time)+'</div><div class="k">Training time</div></div></div>'+(st.hasPrev?'<div class="muted tiny">Percentages compare with the '+period+' days before.</div>':'');
  h+='<div class="card"><h2>Volume by week</h2>'+barChart(weeklyVolume(10).map(x=>({l:x.l,v:unit()==='kg'?x.v/KG:x.v})),v=>v>=1000?Math.round(v/1000)+'k':Math.round(v))+'</div>';
  const tot=Object.values(st.mus).reduce((a,b)=>a+b,0),mx=Math.max(1,...Object.values(st.mus));const lv={};Object.keys(st.mus).forEach(m=>lv[m]=st.mus[m]/mx);
  h+='<div class="card"><h2>Sets per muscle</h2><div class="muted tiny">A primary muscle counts one set, a secondary muscle half a set.</div>'+bodySVG(lv,240)+Object.keys(MUS).sort((a,b)=>st.mus[b]-st.mus[a]).map(m=>'<div class="row small"><span style="width:92px">'+MUS[m]+'</span><div class="bar grow"><i style="width:'+(st.mus[m]/mx*100).toFixed(0)+'%"></i></div><span class="num" style="width:74px;text-align:right">'+(Math.round(st.mus[m]*10)/10)+' · '+(tot?Math.round(st.mus[m]/tot*100):0)+'%</span></div>').join('')+'</div>';

  if(topEx.length)h+='<div class="card"><h2>Main exercises</h2><div class="list">'+topEx.map(id=>{const ss=exSessions(id);const f=ss[0],l=ss[ss.length-1];const x=ss.length>1?pctChange(l.rm,f.rm):null;return '<button class="item" data-a="openEx" data-id="'+id+'"><div class="grow"><div style="font-weight:600">'+esc(exBy(id).name)+'</div><div class="muted small">'+st.exCount[id]+' sets · est. 1RM '+disp(l.rm)+' '+unit()+'</div></div>'+(x==null?'':'<span class="'+(x>=0?'good':'bad')+' small">'+(x>=0?'+':'')+x+'%</span>')+'</button>'}).join('')+'</div></div>';

function calendarCard(){const now=new Date(),y=now.getFullYear(),m=now.getMonth();const days=new Date(y,m+1,0).getDate(),first=(new Date(y,m,1).getDay()+6)%7;const on={};Object.values(S.workouts).forEach(w=>{const d=new Date(w.start);if(d.getFullYear()===y&&d.getMonth()===m)on[d.getDate()]=1});

  for(let d=56;d>=1;d--){const day=new Date(today.getTime()-d*DAY);let ri=sched[day.getDay()];if(ri===undefined)continue;if(day.getDay()===6){ri=alt%3;alt++}

  for(let d=56;d>=0;d--){const t=today.getTime()-d*DAY;const k=dayKey(t);if(S.body.entries.some(e=>e.d===k))continue;S.body.entries.push({d:k,w:204-(56-d)*0.085+Math.sin(d*1.7)*1.1+Math.cos(d*0.9)*0.5,sample:true})}

}
