<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>English with Ben</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1F3FA;--surface:#fff;--surface2:#E9ECF7;--ink:#1B2148;--muted:#5A6285;--line:#DDE1F0;--accent:#3F78EA;--accent-d:#2C5BC4;--good:#2FA36B;--warn:#E89A2B;--bad:#E0566F;--teal:#2E9C97;--sun:#F7D154;--head:"Baloo 2","Nunito",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.45;font-weight:600}
button,select{font-family:inherit;font-size:1rem;cursor:pointer;color:inherit;font-weight:700}
#app{max-width:760px;margin:0 auto;padding:14px 14px 100px}
h2{font-family:var(--head);font-size:1.6rem;margin:6px 0 8px;line-height:1.15}
h3{font-family:var(--head);font-size:1.15rem;margin:0 0 4px}
.cap{font-family:var(--head);font-size:.82rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:22px 2px 10px;font-weight:700}
.card{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:16px;margin:10px 0;box-shadow:0 5px 0 var(--line)}
button.card{display:block;width:100%;text-align:center}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sb{justify-content:space-between}
.btn{background:var(--accent);color:#fff;border:0;border-radius:16px;padding:12px 18px;min-height:48px;box-shadow:0 4px 0 var(--accent-d);font-family:var(--head);font-size:1.05rem}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--accent-d)}
.btn.alt{background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.bad{background:var(--bad);box-shadow:0 4px 0 #B83F56}.btn.warn{background:var(--warn);box-shadow:0 4px 0 #BE7A17}.btn.teal{background:var(--teal);box-shadow:0 4px 0 #1F7773}
.btn.sm{padding:6px 12px;min-height:38px;font-size:.92rem;border-radius:12px}.btn:disabled{opacity:.4}.wide{width:100%}.big3{font-size:1.25rem;min-height:56px}
.chip{display:inline-block;background:#FFF3C9;border-radius:999px;padding:3px 11px;font-size:.82rem;font-weight:700;margin:2px 4px 2px 0}.chip.g{background:#D3F0E0}.chip.r{background:#FBD9E0}
.muted{color:var(--muted);font-size:.92rem}.vi{color:#2C7FB8;font-weight:700}body.novi .vi{display:none}
.seg{display:flex;background:var(--surface2);border-radius:14px;padding:4px;gap:4px}.seg button{flex:1;border:0;background:transparent;border-radius:11px;padding:8px 6px;color:var(--muted)}.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(27,33,72,.12)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.scroll{display:flex;gap:12px;overflow-x:auto;margin:0 -14px;padding:2px 14px 12px;scroll-snap-type:x proximity;scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}.scroll>*{scroll-snap-align:start}
.tile,.dtile,.gtile{background:var(--surface);border:2px solid var(--line);border-radius:22px;box-shadow:0 5px 0 var(--line);text-align:left;padding:0 0 12px;overflow:hidden}
.tile{padding:14px}.tile b{display:block;font-family:var(--head);font-size:1.05rem}.tile span{font-size:.84rem;color:var(--muted)}
.dtile{flex:0 0 150px}.dtile b{display:block;font-family:var(--head);font-size:1rem;line-height:1.15;margin:0 10px;min-height:2.3em}.dtile span{display:block;font-size:.78rem;color:var(--muted);margin:4px 10px 0}.dtile .bar{margin:6px 10px 0}.dtile em{color:var(--bad);font-style:normal}
.gtile{flex:0 0 172px}.grid .gtile{flex:auto}
.gart{position:relative;height:104px;overflow:hidden}.gart:after{content:"";position:absolute;right:-30px;top:-40px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.14)}.gart svg{width:100%;height:100%;display:block}
.gtxt{padding:8px 12px 0}.gtxt b{display:block;font-family:var(--head);font-size:1.2rem;line-height:1.1}.gtxt em{display:block;font-style:normal;color:var(--muted);font-weight:800;font-size:.9rem}.gtxt span{display:block;font-size:.84rem;color:var(--muted);margin-top:2px}
.stars{display:inline-flex;gap:1px;background:rgba(255,255,255,.85);border-radius:999px;padding:1px 8px}.gart .stars{position:absolute;right:8px;top:8px;z-index:1}.stars i{font-style:normal;color:#D5D9E8;font-size:.95rem}.stars i.on{color:#F5B323}
.bar{height:7px;background:var(--surface2);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--good);border-radius:9px}
.big{font-family:var(--head);font-size:2.1rem;line-height:1.15;margin:6px 0 2px}
.flash{min-height:250px;display:flex;flex-direction:column;justify-content:center;text-align:center;align-items:center}.fc{cursor:pointer}
.ex{background:var(--surface2);border-radius:14px;padding:10px 12px;margin-top:10px;text-align:left;width:100%}.ex b{color:var(--accent-d)}
.opt{display:block;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);border-radius:16px;padding:14px;margin:10px 0}.opt.ok{border-color:var(--good);background:#E3F6EC}.opt.no{border-color:var(--bad);background:#FDE6EB}
textarea,input[type=text],select{width:100%;font:inherit;border:2px solid var(--line);border-radius:14px;padding:12px;background:#fff;color:var(--ink)}textarea{min-height:120px}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid var(--line);display:flex;justify-content:center;z-index:5}
nav button{flex:1;max-width:190px;border:0;background:none;padding:9px 4px 12px;font-size:.8rem;color:var(--muted)}nav button svg{display:block;margin:0 auto 2px;width:25px;height:25px}nav button.on{color:var(--accent)}
.back{background:none;border:0;color:var(--accent);padding:8px 0;font-family:var(--head);font-size:1.05rem}
.pair{display:flex;gap:8px;margin:8px 0}.pair button{flex:1}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:.92rem;z-index:9;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;text-align:center}.toast.on{opacity:1}
.ans{border-left:4px solid var(--sun);padding-left:10px;margin:10px 0}
.intro{position:relative;height:420px;border-radius:26px;overflow:hidden;background:#ccd;box-shadow:0 5px 0 var(--line)}
.intro img{width:100%;height:100%;object-fit:cover;object-position:50% 12%;display:block;transition:opacity .25s}
.intro:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(27,33,72,0) 45%,rgba(27,33,72,.8))}
.intro div{position:absolute;left:18px;bottom:14px;z-index:1;color:#fff}.intro h1{font-family:var(--head);font-size:2.3rem;margin:0;line-height:1}.intro p{margin:2px 0 0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;margin-bottom:12px}.stats b{display:block;font-size:1.6rem;font-family:var(--head);line-height:1.1}.stats span{font-size:.72rem;color:var(--muted)}
.note{display:flex;gap:10px;align-items:center;margin-top:14px;padding-top:12px;border-top:2px solid var(--line);font-size:.92rem}.note img{width:52px;height:52px;border-radius:50%;object-fit:cover;flex:none}
img.cover{width:100%;height:92px;object-fit:cover;display:block;margin-bottom:8px}
img.pic{width:150px;height:150px;border-radius:20px;object-fit:cover;margin:0 auto 8px;display:block}
img.thumb{width:44px;height:44px;border-radius:12px;object-fit:cover;flex:none;vertical-align:middle}
.li{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:2px solid var(--line)}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.grades .btn{padding:8px 2px;display:flex;flex-direction:column;align-items:center}.grades small{font-weight:600;font-size:.68rem;opacity:.95;font-family:"Nunito",sans-serif}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mt{display:flex;align-items:center;gap:8px;width:100%;min-height:64px;margin-bottom:8px;background:var(--surface);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);border-radius:16px;padding:8px 10px;text-align:left;font-size:.95rem;transition:opacity .3s,transform .15s}
.mt.c{justify-content:center;text-align:center;margin:0}.mt.sel{border-color:var(--accent);background:#E4EDFF}.mt.no{border-color:var(--bad);background:#FDE6EB;transform:translateX(4px)}.mt.gone{opacity:0;pointer-events:none}
.slots{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:12px 0}.slots.line{min-height:54px;border-bottom:3px dashed var(--line);padding-bottom:10px;align-items:center}
.lt{width:42px;height:48px;border-radius:12px;border:2px solid #E7C441;background:var(--sun);box-shadow:0 3px 0 #D9B22E;font-size:1.2rem;text-transform:lowercase;font-family:var(--head)}.lt.empty{background:var(--surface2);border-color:var(--line);box-shadow:none}.lt:disabled,.wd:disabled{opacity:.2}
.wd{border-radius:12px;border:2px solid var(--line);background:#fff;box-shadow:0 3px 0 var(--line);padding:8px 12px;font-size:1rem}.wd.y{background:var(--sun);border-color:#E7C441;box-shadow:0 3px 0 #D9B22E}
@media(min-width:640px){.grid{grid-template-columns:repeat(4,1fr)}.intro{height:380px}.dtile{flex-basis:170px}}
@media(prefers-reduced-motion:no-preference){.card,.dtile,.gtile{animation:up .25s ease both}@keyframes up{from{opacity:0;transform:translateY(6px)}}}
.dots{position:absolute;right:14px;bottom:16px;z-index:2;display:flex;gap:6px}.dots button{width:10px;height:10px;border-radius:50%;border:0;padding:0;background:rgba(255,255,255,.5)}.dots button.on{background:#fff}
img.donepic{width:150px;height:150px;border-radius:50%;object-fit:cover;object-position:50% 8%;margin-bottom:6px}
@media(min-width:640px){.intro{height:560px}}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav"></nav>
<div class="toast" id="toast"></div>
<script>

const PACKS=[
{id:'feel',t:'Feelings',d:'More than happy, sad and angry',w:[
['thrilled','adj','rất vui sướng, phấn khích','very happy','I was {thrilled} when you surprised me with flowers.'],
['relieved','adj','nhẹ nhõm','happy (after worrying)','I felt {relieved} when she finally texted me back.'],
['overwhelmed','adj','quá tải, choáng ngợp','too busy / too much','I feel {overwhelmed} when everyone messages me at once.'],
['disappointed','adj','thất vọng','sad','I was {disappointed} that he cancelled again.'],
['frustrated','adj','bực bội, khó chịu','angry','I get {frustrated} when I can\'t find the right word.'],
['anxious','adj','lo lắng, bồn chồn','worried','I always feel {anxious} before a big meeting.'],
['grateful','adj','biết ơn','thankful','I\'m {grateful} for everything my mom did for me.'],
['exhausted','adj','kiệt sức','very tired','After the wedding I was completely {exhausted}.']]},
{id:'people',t:'Describing people',d:'More than nice and good',w:[
['thoughtful','adj','chu đáo, ân cần','nice','He is so {thoughtful}. He always remembers small things.'],
['reliable','adj','đáng tin cậy','good','I need an assistant who is {reliable}.'],
['stubborn','adj','bướng bỉnh, cứng đầu','never changes','My dad is {stubborn}. He never changes his mind.'],
['generous','adj','hào phóng, rộng rãi','kind','She is {generous} with her time and her money.'],
['easygoing','adj','dễ tính, thoải mái','relaxed','My sister is {easygoing}, so she rarely gets upset.'],
['ambitious','adj','có tham vọng, cầu tiến','wants a lot','She is {ambitious} and wants her own company.'],
['sensitive','adj','nhạy cảm','gets hurt easily','Be gentle with him. He is very {sensitive}.'],
['down-to-earth','adj','giản dị, gần gũi, không kiêu','simple, normal','She is famous, but she is really {down-to-earth}.']]},
{id:'opinion',t:'Giving your opinion',d:'More than "I think"',w:[
['from my point of view','phrase','theo quan điểm của tôi','I think','{From my point of view}, family comes first.'],
['convinced','adj','tin chắc','sure','I\'m {convinced} that travel changes people.'],
['doubt','verb','nghi ngờ, không tin lắm','don\'t think','I {doubt} he will come on time.'],
['it depends on','phrase','tùy thuộc vào','maybe','{It depends on} how much time we have.'],
['reasonable','adj','hợp lý','OK, fair','That price sounds {reasonable} to me.'],
['unfair','adj','bất công, không công bằng','not right','It is {unfair} to blame her for everything.'],
['worth it','phrase','xứng đáng, đáng','good to do','The trip was expensive, but it was {worth it}.'],
['I\'d rather','phrase','tôi thích … hơn / thà … hơn','I want','{I\'d rather} stay home tonight than go out.']]},
{id:'love',t:'Relationships',d:'Talking about us',w:[
['trust','verb','tin tưởng','believe','I {trust} you completely.'],
['support','verb','ủng hộ, hỗ trợ','help','My friends always {support} my decisions.'],
['argue','verb','cãi nhau, tranh cãi','fight','We sometimes {argue} about small things.'],
['compromise','verb','thỏa hiệp, nhường nhau','meet in the middle','In a relationship, both people have to {compromise}.'],
['appreciate','verb','trân trọng, cảm kích','like / thank','I really {appreciate} how patient you are.'],
['get along','phr. verb','hòa hợp, hợp nhau','be friendly','I {get along} well with your brother.'],
['misunderstanding','noun','sự hiểu lầm','mistake','It was just a {misunderstanding}, not a real problem.'],
['take for granted','phrase','xem là điều hiển nhiên','not notice','I never want to {take for granted} what we have.']]},
{id:'work',t:'Work and clients',d:'Explain what you do',w:[
['deal with','phr. verb','xử lý, giải quyết','fix','I {deal with} bar owners every day.'],
['deadline','noun','hạn chót','last day','The {deadline} for the video is Friday.'],
['negotiate','verb','thương lượng, đàm phán','talk about price','I had to {negotiate} a better price.'],
['responsible for','phrase','chịu trách nhiệm về','I do','I\'m {responsible for} about a hundred people.'],
['demanding','adj','khó tính, đòi hỏi cao','difficult','That client is very {demanding}.'],
['schedule','noun','lịch trình','plan','My {schedule} is full this week.'],
['remind','verb','nhắc nhở','tell again','Please {remind} me to call her tomorrow.'],
['professional','adj','chuyên nghiệp','good at work','She is always {professional} with clients.']]},
{id:'stress',t:'Problems and stress',d:'When things get hard',w:[
['struggle with','phr. verb','gặp khó khăn với, chật vật với','have a problem','I {struggle with} long conversations in English.'],
['handle','verb','xử lý, đối phó','do, fix','Don\'t worry, I can {handle} it.'],
['pressure','noun','áp lực','stress','There is a lot of {pressure} in my job.'],
['figure out','phr. verb','tìm ra, hiểu ra','understand','I need to {figure out} what went wrong.'],
['give up','phr. verb','bỏ cuộc','stop','It was hard, but I didn\'t {give up}.'],
['get through','phr. verb','vượt qua','finish a hard time','We will {get through} this together.'],
['solution','noun','giải pháp','answer','We need a {solution} that works for everyone.'],
['mess up','phr. verb','làm hỏng, làm sai','do wrong','I don\'t want to {mess up} this chance.']]},
{id:'future',t:'Plans and dreams',d:'Talking about the future',w:[
['goal','noun','mục tiêu','plan','My {goal} is to speak English with confidence.'],
['achieve','verb','đạt được','get','You can {achieve} a lot in one year.'],
['look forward to','phrase','mong chờ, háo hức','want','I {look forward to} our trip next month.'],
['eventually','adv','cuối cùng rồi cũng (sau một thời gian)','later','It took time, but {eventually} she agreed.'],
['opportunity','noun','cơ hội','chance','This job is a great {opportunity} for me.'],
['improve','verb','cải thiện','get better','I want to {improve} my pronunciation.'],
['save up','phr. verb','để dành tiền','keep money','We should {save up} for a house.'],
['settle down','phr. verb','ổn định cuộc sống','stay in one place','One day I want to {settle down} near my family.']]},
{id:'story',t:'Memories and stories',d:'Telling what happened',w:[
['remind me of','phrase','làm tôi nhớ đến','makes me remember','This song will always {remind me of} Hoi An.'],
['used to','phrase','đã từng (thói quen trước đây)','before','I {used to} live with my grandmother.'],
['unforgettable','adj','khó quên','very special','It was an {unforgettable} night.'],
['embarrassing','adj','đáng xấu hổ, ngại','shy, bad','I fell in front of everyone. It was so {embarrassing}!'],
['suddenly','adv','đột nhiên, bất ngờ','fast','We were walking, and {suddenly} it started to rain.'],
['realize','verb','nhận ra','know','I didn\'t {realize} how late it was.'],
['miss','verb','nhớ (ai đó, điều gì)','think about','I {miss} my hometown when I\'m in Saigon.'],
['grow up','phr. verb','lớn lên','be a child','Where did you {grow up}?']]},
{id:'strong',t:'Stronger words',d:'Instead of "very" + word',w:[
['delicious','adj','rất ngon','very good (food)','The soup your mom made was {delicious}.'],
['gorgeous','adj','rất đẹp, lộng lẫy','very beautiful','The sunset over the river was {gorgeous}.'],
['hilarious','adj','rất buồn cười','very funny','That video is {hilarious}.'],
['awful','adj','tệ kinh khủng','very bad','The traffic was {awful} this morning.'],
['huge','adj','rất lớn, khổng lồ','very big','They live in a {huge} house.'],
['tiny','adj','rất nhỏ, tí hon','very small','My first room in Saigon was {tiny}.'],
['fascinating','adj','rất thú vị, cuốn hút','very interesting','Her life story is {fascinating}.'],
['crowded','adj','đông đúc','many people','The market is always {crowded} on Sundays.']]},
{id:'link',t:'Connecting ideas',d:'Make longer sentences',w:[
['however','adv','tuy nhiên','but','I love Saigon. {However}, the traffic is terrible.'],
['although','conj','mặc dù','but','{Although} I was tired, I went to the party.'],
['because of','phrase','bởi vì, do (+ danh từ)','because','We were late {because of} the rain.'],
['as a result','phrase','kết quả là, vì vậy','so','She practised every day. {As a result}, she improved fast.'],
['on the other hand','phrase','mặt khác','but also','The job pays well. {On the other hand}, the hours are long.'],
['for instance','phrase','ví dụ như','for example','I love street food, {for instance}, bánh xèo.'],
['actually','adv','thật ra (không phải "hiện tại")','really','I thought it was easy, but {actually} it was hard.'],
['in the end','phrase','cuối cùng, rốt cuộc','finally','We talked for hours, and {in the end} we agreed.']]}
];
// basic word she already uses -> richer words to try
const UPGRADE={happy:['thrilled','relieved','grateful'],sad:['disappointed'],angry:['frustrated'],mad:['frustrated'],tired:['exhausted'],worried:['anxious'],scared:['anxious'],nice:['thoughtful','generous'],kind:['thoughtful','generous'],good:['reliable','reasonable','delicious','professional'],bad:['awful'],big:['huge'],small:['tiny'],funny:['hilarious'],beautiful:['gorgeous'],pretty:['gorgeous'],interesting:['fascinating'],think:['from my point of view','convinced'],but:['however','although','on the other hand'],so:['as a result'],like:['appreciate','look forward to'],fight:['argue'],problem:['struggle with','misunderstanding'],fix:['figure out','handle','deal with'],want:['I\'d rather','look forward to'],remember:['remind me of','realize'],very:['try one stronger word instead of "very"'],thing:['say exactly what it is'],stuff:['say exactly what it is']};
const RESCUE=[['How do you say ___ in English?','Tiếng Anh nói ___ như thế nào?'],['Let me think for a second.','Để em nghĩ một chút.'],['What I mean is…','Ý em là…'],['It\'s kind of like…','Nó giống như là…'],['Let me explain it another way.','Để em giải thích cách khác.'],['Can you say that another way?','Anh nói cách khác được không?']];
// q = four questions, easy -> deep. f = sentence starters. m = a model answer.
const TOPICS=[
{id:'day',t:'Your day',q:['How was your day?','What was the best part of today, and what was the hardest part?','Did anything today make you feel frustrated or relieved? What happened?','If you could change one thing about your daily routine, what would it be, and why?'],f:['The best part was… because…','The hardest part was dealing with…','I felt relieved when…','If I could change one thing, I\'d…'],m:'Today was busy, and honestly I felt a little overwhelmed. The best part was lunch with my friend because we laughed a lot. However, a client changed the schedule again, so I was frustrated. In the end I handled it.'},
{id:'family',t:'Family',q:['Tell me about your family.','Who in your family are you most like? In what way?','What is something your parents taught you that you still follow?','How is your life different from your mother\'s life at your age?'],f:['I\'m most like my… because we are both…','My parents taught me to…','When my mom was my age, she…','Although we are different, …'],m:'I\'m most like my mom because we are both stubborn and ambitious. She taught me to be generous, even when we didn\'t have much. I\'m grateful for that. When she was my age, she already had two kids, so my life is very different.'},
{id:'work',t:'Your work',q:['What do you do for work?','What does a normal work day look like for you?','What is the most difficult part of your job, and how do you handle it?','Where do you want your business to be in three years? What has to change?'],f:['I\'m responsible for…','Most days I deal with…','The most difficult part is… I handle it by…','My goal is to…'],m:'I\'m responsible for about a hundred people, so I deal with a lot of messages every day. The most difficult part is demanding clients. I handle it by staying professional and reminding them what we agreed. My goal is to build my own brand.'},

function grade(w,q){const c=S.cards[w]||{s:0,n:0};const [st,iv]=nextIv(c,q);S.cards[w]={s:st,d:dayNum()+iv,n:(c.n||0)+1};save()}

const newList=pid=>ALL().filter(x=>!S.cards[x.w]&&(!pid||x.pack===pid));
const newLeft=()=>Math.max(0,S.perDay-(D().nw||0));
const known=()=>ALL().filter(x=>S.cards[x.w]).length;
let GD='learned';
const pool=n=>{if(GD!=='learned')return ALL().filter(x=>x.pack===GD);const k=ALL().filter(x=>S.cards[x.w]);return k.length>=n?k:ALL()};

/* ---------- views ---------- */
let tab='home';
const ICON={home:'<path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/>',games:'<rect x="3" y="7" width="18" height="11" rx="4"/><path d="M8 11v3M6.5 12.5h3M15.5 11.5h.01M17.5 13.5h.01"/>',speak:'<path d="M4 5h16v11H9l-5 4z"/>',ben:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-5 15-5 16 0"/>'};

function go(t,arg){tab=t;clearInterval(tick);document.body.classList.toggle('novi',!S.vi);nav();({home:vHome,games:vGames,speak:vSpeak,ben:vBen})[t](arg);window.scrollTo(0,0)}

const GAMES=[['match','Match up','Nối cặp','Tap a word, then its meaning.','#4179EE'],['flash','Flash cards','Thẻ','See it, say it, turn it over.','#E05B7A'],['sent','Unjumble','Xếp câu','Put the words back in order.','#7558F0'],['find','Find the match','Tìm từ','Tap the right word until none are left.','#4BA173'],['gap','Fill the gap','Điền từ','One word is missing. Pick it.','#F0913D'],['hear','Listen and choose','Nghe và chọn','No text. Hear it, pick what it means.','#4BA8A4'],['spell','Spell it','Xếp chữ','Put the letters in order.','#5563D6'],['speed','Speed round','Nhanh tay','True or false, 45 seconds.','#E8643C']];
const W='#fff',Y='#F7D154',r=(x,y,w,h,f,o)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${Math.min(h/2,9)}" fill="${f}" opacity="${o||1}"/>`;
const GLYPH={
match:r(40,22,42,16,W)+r(40,46,42,16,W,.7)+r(40,70,42,16,W,.5)+r(118,22,42,16,W,.5)+r(118,46,42,16,W,.7)+r(118,70,42,16,Y)+`<path d="M82 30 C104 30 96 78 118 78" fill="none" stroke="${Y}" stroke-width="4" stroke-linecap="round"/>`,
flash:`<g transform="rotate(-9 100 55)">${r(62,20,62,70,W,.5)}</g><g transform="rotate(6 100 55)">${r(72,16,64,72,W)}<text x="104" y="64" text-anchor="middle" font-size="30" font-weight="800" fill="#E05B7A" font-family="Baloo 2,sans-serif">Aa</text></g>`,
sent:`<g transform="rotate(-6 60 40)">${r(40,28,38,22,W)}</g><g transform="rotate(5 100 58)">${r(84,46,40,24,Y)}</g><g transform="rotate(-4 145 36)">${r(128,24,36,22,W,.7)}</g><path d="M52 88h100" stroke="${W}" stroke-width="4" stroke-dasharray="3 9" stroke-linecap="round"/>`,
find:r(46,22,34,18,W,.55)+r(88,22,34,18,W)+r(130,22,34,18,W,.55)+r(46,50,34,18,W)+r(88,50,34,18,Y)+r(130,50,34,18,W,.55)+`<circle cx="112" cy="64" r="17" fill="none" stroke="${W}" stroke-width="5"/><path d="M124 77l12 12" stroke="${W}" stroke-width="6" stroke-linecap="round"/>`,
gap:r(36,24,32,16,W)+`<rect x="76" y="20" width="44" height="24" rx="8" fill="none" stroke="${W}" stroke-width="4" stroke-dasharray="7 5"/>`+r(128,24,34,16,W)+r(46,62,30,20,W,.7)+r(84,62,30,20,Y)+r(122,62,30,20,W,.7),
hear:`<path d="M56 46v20h14l18 15V31L70 46z" fill="${W}"/><path d="M98 40a20 20 0 010 32M108 30a34 34 0 010 52" fill="none" stroke="${W}" stroke-width="5" stroke-linecap="round"/>`+r(130,32,36,16,W,.6)+r(130,62,36,16,Y),
spell:[0,1,2,3].map(i=>`<g transform="rotate(${[-6,4,-3,6][i]} ${52+i*32} 54)"><rect x="${38+i*32}" y="38" width="28" height="32" rx="7" fill="${i===2?Y:W}"/><text x="${52+i*32}" y="61" text-anchor="middle" font-size="19" font-weight="800" fill="#3b3f7a" font-family="Baloo 2,sans-serif">${'word'[i]}</text></g>`).join(''),
speed:`<circle cx="100" cy="56" r="30" fill="none" stroke="${W}" stroke-width="6"/><path d="M100 56V36M100 56l14 8" stroke="${Y}" stroke-width="6" stroke-linecap="round"/>`+r(92,14,16,8,W)};
const stars=n=>`<span class="stars">${[1,2,3].map(i=>`<i class="${i<=n?'on':''}">★</i>`).join('')}</span>`;
const gameTiles=()=>GAMES.map(g=>`<button class="gtile" data-game="${g[0]}"><div class="gart" style="background:${g[4]}"><svg viewBox="0 0 200 104">${GLYPH[g[0]]}</svg>${(S.stars||{})[g[0]]?stars(S.stars[g[0]]):''}</div><div class="gtxt"><b>${g[1]}</b><em>${g[2]}</em><span>${g[3]}</span></div></button>`).join('');
const startGame=g=>({match:gMatch,gap:gGap,hear:gHear,spell:gSpell,speed:gSpeed,sent:gSent,find:gFind,flash:gFlash})[g]();

function vHome(){
  const due=dueList().length,nw=Math.min(newLeft(),newList().length),wk=Object.keys(S.days).filter(k=>{const s=String(k),dt=new Date(+s.slice(0,4),+s.slice(4,6)-1,+s.slice(6));return (Date.now()-dt)/864e5<7&&Object.keys(S.days[k]).length}).length,total=ALL().length;
  const deckTile=p=>{const all=ALL().filter(x=>x.pack===p.id),k=all.filter(x=>S.cards[x.w]).length,d=dueList(p.id).length;return `<button class="dtile" data-pack="${p.id}">${img(p.art||DECKART[p.id],'cover')}<b>${p.t}</b><div class="bar"><i style="width:${100*k/all.length}%"></i></div><span>${k}/${all.length} words${d?' · <em>'+d+' due</em>':''}</span></button>`};
  R(`<div class="intro"><img id="introimg" src="img/an-${(S.intro||0)+1}.jpg" alt=""><div><h1>Hi An</h1><p>Your English, all in one place.</p></div><span class="dots">${[0,1,2,3,4].map(i=>`<button data-intro="${i}" class="${i===(S.intro||0)?"on":""}" aria-label="Picture ${i+1}"></button>`).join("")}</span></div>
  <div class="card today"><div class="stats"><div><b>${due}</b><span>to review</span></div><div><b>${nw}</b><span>new today</span></div><div><b>${known()}</b><span>of ${total} learned</span></div><div><b>${wk}/6</b><span>days this week</span></div></div>
  <button class="btn wide big3" data-a="study">${due+nw?'Study now':'All done for today. Play a game'}</button>
  <div class="note"><img src="img/ben.jpg" alt=""><div><b>Ben</b><br>Do your cards, play one game, then tell me about your day tonight.</div></div></div>
  <div class="cap">Trò chơi · Games</div><div class="scroll">${gameTiles()}</div>
  ${GROUPS.map(g=>{const ds=decks().filter(p=>grp(p)===g[0]);return ds.length?`<div class="cap">${g[1]} · ${ds.reduce((a,p)=>a+p.w.length,0)} words</div><div class="scroll">${ds.map(deckTile).join('')}</div>`:''}).join('')}
  <div class="cap">Cài đặt · Settings</div><div class="card"><div class="row sb"><span>Vietnamese help</span><div class="seg" style="width:140px"><button class="${S.vi?'on':''}" data-vi="1">On</button><button class="${!S.vi?'on':''}" data-vi="0">Off</button></div></div>
  <div class="row sb" style="margin-top:10px"><span>Voice speed</span><div class="seg" style="width:140px"><button class="${S.slow?'on':''}" data-slow="1">Slow</button><button class="${!S.slow?'on':''}" data-slow="0">Normal</button></div></div>
  <div class="row sb" style="margin-top:10px"><span>New cards a day</span><div class="seg" style="width:170px">${[5,10,20].map(n=>`<button class="${S.perDay===n?'on':''}" data-per="${n}">${n}</button>`).join('')}</div></div></div>`);
  clearInterval(tick);tick=setInterval(()=>setIntro(((S.intro||0)+1)%5),7000);
  $('#app').onclick=e=>{const b=e.target.closest('button');if(!b)return;
    if(b.dataset.intro!=null){setIntro(+b.dataset.intro);return}
    if(b.dataset.a==='study')(due+nw)?study():go('games');
    else if(b.dataset.pack)vDeck(b.dataset.pack);else if(b.dataset.game){GD='learned';startGame(b.dataset.game)}
    else if(b.dataset.vi){S.vi=b.dataset.vi==='1';save();go('home')}
    else if(b.dataset.slow){S.slow=b.dataset.slow==='1';save();vHome();say('This is how fast I will speak.')}
    else if(b.dataset.per){S.perDay=+b.dataset.per;save();vHome()}}}

function setIntro(i){S.intro=i;const im=$('#introimg');if(!im)return;im.style.opacity=0;setTimeout(()=>{im.src='img/an-'+(i+1)+'.jpg';im.style.opacity=1},250);document.querySelectorAll('.dots button').forEach((x,k)=>x.classList.toggle('on',k===i))}
function vDeck(pid){
  const p=decks().find(x=>x.id===pid),all=ALL().filter(x=>x.pack===pid),d=dueList(pid).length,n=newList(pid).length;
  R(`<button class="back" data-a="back">‹ Home</button><h2>${p.t}</h2><p class="muted">${d} to review · ${n} new · ${all.length} cards</p>
  <div class="row"><button class="btn" data-a="study">${d||n?'Study this deck':'Study again'}</button><button class="btn alt" data-a="match">Play games with it</button></div>
  ${all.map(x=>{const c=S.cards[x.w];return `<div class="li">${img(x.pic,'thumb')}<div style="flex:1"><b>${esc(x.w)}</b> <span class="muted">${esc(x.p)}</span><br><span class="vi">${esc(x.vi)}</span></div><span class="chip ${c?(c.s>=4?'g':''):'r'}">${c?(c.s>=4?'strong':'learning'):'new'}</span><button class="btn alt sm" data-say="${esc(x.w)}">▸</button></div>`}).join('')}`);
  $('#app').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.a==='back')go('home');else if(b.dataset.say)say(b.dataset.say);else if(b.dataset.a==='study')study(pid);else if(b.dataset.a==='match'){GD=pid;go('games')}}}

function study(pid){
  let q=shuffle(dueList(pid)).map(x=>({x,nw:false}));
  const fresh=newList(pid).slice(0,pid?8:newLeft()).map(x=>({x,nw:true}));q=q.concat(fresh);
  if(!q.length&&pid)q=shuffle(ALL().filter(x=>x.pack===pid)).map(x=>({x,nw:false,extra:true}));
  let done=0,flip=false;const total=q.length;
  const show=()=>{if(!q.length){D().st=1;save();R(`<div class="card flash"><img class="donepic" src="img/an-4.jpg" alt=""><div class="big">Done</div><p class="muted">${total} cards. They come back just before you would forget them.</p><div class="row" style="justify-content:center"><button class="btn" data-a="game">Play a game</button><button class="btn alt" data-a="home">Home</button></div></div>`);
      $('#app').onclick=e=>{const b=e.target.closest('button');if(b)go(b.dataset.a==='game'?'games':'home')};return}
    const it=q[0],x=it.x,c=S.cards[x.w],rev=!it.nw&&c&&c.s>=2; // older cards: recall the English word
    const back=`${img(x.pic)}<div class="big">${esc(x.w)}</div><div class="muted">${esc(x.p)}</div><div class="vi">${esc(x.vi)}</div>${x.b?`<div><span class="chip r">Instead of: ${esc(x.b)}</span></div>`:''}${x.ex?`<div class="ex">${exHtml(x.ex)}</div>`:''}`;
    const front=rev?`<p class="muted">Say the English word, then check.</p>${img(x.pic)}<div class="vi" style="font-size:1.25rem">${esc(x.vi)}</div>${x.b?`<div class="muted">a better word for “${esc(x.b)}”</div>`:''}${x.ex?`<div class="ex">${gap(x.ex)}</div>`:''}`
      :`${it.nw?'<span class="chip">New</span>':''}${img(x.pic)}<div class="big">${esc(x.w)}</div><div class="muted">${esc(x.p)}</div><p class="muted">Do you know what it means?</p>`;
    R(`<button class="back" data-a="back">‹ Home</button><div class="bar" style="margin:0 0 10px"><i style="width:${100*done/total}%"></i></div>
    <div class="card flash">${flip?back:front}</div>
    ${flip?`<div class="grades">${[['Again','bad'],['Hard','warn'],['Good',''],['Easy','teal']].map((g,i)=>`<button class="btn ${g[1]}" data-q="${i}">${g[0]}<small>${ivLabel(nextIv(c,i)[1])}</small></button>`).join('')}</div><button class="btn alt wide" data-a="hear" style="margin-top:8px">Listen again</button>`
      :`<button class="btn wide" data-a="flip">Show answer</button>`}`);
    if(!rev&&!flip)say(x.w);
    $('#app').onclick=e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.a;
      if(a==='back')go('home');else if(a==='flip'){flip=true;show();say(x.w+'. '+exPlain(x.ex))}else if(a==='hear')say(x.w+'. '+exPlain(x.ex));
      else if(b.dataset.q){const g=+b.dataset.q;if(!it.extra){if(it.nw&&!S.cards[x.w])D().nw=(D().nw||0)+1;grade(x.w,g)}q.shift();if(g===0)q.push({x,nw:false,extra:it.extra});else done++;flip=false;show()}}};
  show()}

/* ---------- games ---------- */
function endGame(id,title,line,score,better,st){const old=S.best[id];if(score!=null&&(old==null||better(score,old)))S.best[id]=score;S.stars=S.stars||{};if(st&&st>(S.stars[id]||0))S.stars[id]=st;D().gm=1;save();
  R(`<div class="card flash"><div class="big">${title}</div>${st?stars(st):''}<p class="muted">${line}</p>${S.best[id]!=null?`<p>Best: <b>${S.best[id]}</b></p>`:''}<div class="row" style="justify-content:center"><button class="btn" data-a="again">Play again</button><button class="btn alt" data-a="games">All games</button></div></div>`);
  $('#app').onclick=e=>{const b=e.target.closest('button');if(!b)return;b.dataset.a==='again'?startGame(id):go('games')}}
const pct=(a,b)=>a/b>=.9?3:a/b>=.6?2:1;
const gTop=(t,sub)=>`<button class="back" data-a="back">‹ Games</button><h2>${t}</h2><p class="muted">${sub}</p>`;

function gMatch(){
  const set=shuffle(pool(6)).slice(0,6),L=shuffle(set),Rr=shuffle(set);let pick=null,left=set.length,miss=0;const t0=Date.now();
  R(gTop('Match','Tap a word, then its meaning.')+`<p class="muted" id="clock">0s</p><div class="match"><div>${L.map(x=>`<button class="mt" data-l="${esc(x.w)}">${esc(x.w)}</button>`).join('')}</div><div>${Rr.map(x=>`<button class="mt" data-r="${esc(x.w)}">${x.pic?img(x.pic,'thumb'):''}<span>${esc(mean(x))}</span></button>`).join('')}</div></div>`);
  clearInterval(tick);tick=setInterval(()=>{const c=$('#clock');if(c)c.textContent=Math.round((Date.now()-t0)/1000)+'s'},500);
  $('#app').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.a==='back')return go('games');if(b.classList.contains('gone'))return;
    if(b.dataset.l!=null){document.querySelectorAll('.mt.sel').forEach(x=>x.classList.remove('sel'));pick=b;b.classList.add('sel');say(b.dataset.l)}
    else if(b.dataset.r!=null&&pick){if(pick.dataset.l===b.dataset.r){pick.classList.add('gone');b.classList.add('gone');pick.classList.remove('sel');pick=null;left--;
        if(!left){clearInterval(tick);const s=Math.round((Date.now()-t0)/1000);setTimeout(()=>endGame('match','All matched',s+' seconds, '+miss+' misses.',s+'s',(a,o)=>parseInt(a)<parseInt(o),miss===0?3:miss<=2?2:1),400)}}
      else{miss++;b.classList.add('no');setTimeout(()=>b.classList.remove('no'),400)}}}}

function rounds(id,title,sub,n,make){const qs=shuffle(pool(8).filter(x=>x.ex||id!=='gap')).slice(0,n);let i=0,right=0;
  const show=()=>{if(i>=qs.length)return endGame(id,right+' of '+qs.length,'Use one of these words with Ben today.',right+'/'+qs.length,(a,o)=>parseInt(a)>parseInt(o),pct(right,qs.length));
    const x=qs[i],opts=shuffle([x].concat(shuffle(ALL().filter(y=>y.w!==x.w&&(id!=='gap'||y.pack===x.pack))).slice(0,3)));
    R(gTop(title,sub)+`<div class="bar" style="margin:0 0 10px"><i style="width:${100*i/qs.length}%"></i></div>`+make(x,opts)+'<div id="fb"></div>');
    if(id==='hear')say(x.w);let done=false;
    $('#app').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.a==='back')return go('games');if(b.dataset.a==='again')return say(x.w);if(b.dataset.a==='next'){i++;return show()}
      if(done||b.dataset.w==null)return;done=true;const ok=b.dataset.w===x.w;if(ok)right++;b.classList.add(ok?'ok':'no');document.querySelectorAll('.opt').forEach(o=>{if(o.dataset.w===x.w)o.classList.add('ok')});
      say(x.ex?exPlain(x.ex):x.w);$('#fb').innerHTML=`<div class="ex">${img(x.pic,'thumb')} <b>${esc(x.w)}</b> <span class="vi">${esc(x.vi)}</span>${x.ex?'<br>'+exHtml(x.ex):''}</div><button class="btn wide" data-a="next" style="margin-top:10px">Next</button>`}};
  show()}
const gGap=()=>rounds('gap','Fill the gap','Which word fits?',6,(x,o)=>`<div class="card">${img(x.pic)}<div style="font-size:1.15rem;font-weight:600">${gap(x.ex)}</div>${x.b?`<p class="muted" style="margin:8px 0 0">Basic way: ${esc(x.b)}</p>`:''}</div>${o.map(y=>`<button class="opt" data-w="${esc(y.w)}">${esc(y.w)}</button>`).join('')}`);
const gHear=()=>rounds('hear','Listen and choose','Hear the word. What does it mean?',6,(x,o)=>`<div class="card" style="text-align:center"><button class="btn" data-a="again">▸ Hear it again</button></div>${o.map(y=>`<button class="opt" data-w="${esc(y.w)}">${esc(mean(y))}</button>`).join('')}`);

function gSpell(){
  const qs=shuffle(pool(8).filter(x=>/^[a-z]{4,12}$/.test(x.w))).slice(0,5);if(!qs.length){toast('No single words in this deck.');return go('games')}let i=0,right=0;
  const show=()=>{if(i>=qs.length)return endGame('spell',right+' of '+qs.length,'Spelling sticks when you build the word yourself.',right+'/'+qs.length,(a,o)=>parseInt(a)>parseInt(o),pct(right,qs.length));
    const x=qs[i];let tiles=shuffle(x.w.split('').map((ch,k)=>({ch,k})));if(tiles.map(t=>t.ch).join('')===x.w)tiles.reverse();let built=[],tries=0;
    const draw=()=>{R(gTop('Spell it','Tap the letters in the right order.')+`<div class="bar" style="margin:0 0 10px"><i style="width:${100*i/qs.length}%"></i></div>
      <div class="card" style="text-align:center">${img(x.pic)}<div class="vi" style="font-size:1.15rem">${esc(mean(x))}</div>${x.ex?`<div class="ex">${gap(x.ex)}</div>`:''}
      <div class="slots">${x.w.split('').map((_,k)=>`<button class="lt ${built[k]?'':'empty'}" data-un="${k}">${built[k]?built[k].ch:''}</button>`).join('')}</div>
      <div class="slots">${tiles.map(t=>`<button class="lt" data-k="${t.k}" ${built.includes(t)?'disabled':''}>${t.ch}</button>`).join('')}</div>
      <button class="btn alt sm" data-a="skip">Show me</button></div>`);};
    draw();
    $('#app').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.a==='back')return go('games');
      if(b.dataset.a==='skip'){say(x.w);toast(x.w);i++;return setTimeout(show,900)}
      if(b.dataset.k!=null){built.push(tiles.find(t=>t.k===+b.dataset.k));if(built.length===x.w.length){if(built.map(t=>t.ch).join('')===x.w){if(!tries)right++;say(x.w);toast('Right: '+x.w);i++;return setTimeout(show,700)}tries++;toast('Not yet. Try again.');built=[]}draw()}
      else if(b.dataset.un!=null&&built[+b.dataset.un]){built.splice(+b.dataset.un);draw()}}};
  show()}

function gSpeed(){
  const all=pool(8);let score=0,n=0,left=45,cur=null;
  const next=()=>{const x=all[Math.floor(Math.random()*all.length)],truth=Math.random()<.5;let y=x;if(!truth){do{y=all[Math.floor(Math.random()*all.length)]}while(y.w===x.w)}cur={x,y,truth};
    R(gTop('Speed round','Does the meaning match the word?')+`<div class="row sb"><b id="clock">${left}s</b><b>${score} right</b></div><div class="card flash"><div class="big">${esc(x.w)}</div><div class="vi" style="font-size:1.2rem">${esc(mean(y))}</div></div><div class="pair"><button class="btn bad" data-tf="0">No</button><button class="btn" data-tf="1">Yes</button></div>`)};
  next();clearInterval(tick);tick=setInterval(()=>{left--;const c=$('#clock');if(c)c.textContent=left+'s';if(left<=0){clearInterval(tick);endGame('speed',score+' right','Out of '+n+' in 45 seconds.',String(score),(a,o)=>+a>+o,score>=15?3:score>=8?2:1)}},1000);
  $('#app').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.a==='back')return go('games');if(b.dataset.tf==null)return;n++;if((b.dataset.tf==='1')===cur.truth)score++;else toast(cur.x.w+' = '+mean(cur.x));next()}}

function gSent(){
  const qs=shuffle(pool(8).filter(x=>{const n=x.ex?exPlain(x.ex).split(' ').length:0;return n>=4&&n<=9})).slice(0,5);if(!qs.length){toast('No short sentences in this deck.');return go('games')}
  let i=0,right=0;
  const show=()=>{if(i>=qs.length)return endGame('sent',right+' of '+qs.length,'Say each sentence out loud once more.',right+'/'+qs.length,(a,o)=>parseInt(a)>parseInt(o),pct(right,qs.length));
    const x=qs[i],words=exPlain(x.ex).split(' ');let tiles=shuffle(words.map((ch,k)=>({ch,k})));if(tiles.map(t=>t.ch).join(' ')===words.join(' '))tiles.reverse();let built=[],tries=0;
    const draw=()=>{R(gTop('Unjumble','Put the words back in order.')+`<div class="bar" style="margin:0 0 10px"><i style="width:${100*i/qs.length}%"></i></div>
      <div class="card" style="text-align:center">${img(x.pic)}<div><b>${esc(x.w)}</b> <span class="vi">${esc(x.vi)}</span></div>
      <div class="slots line">${built.length?built.map((t,k)=>`<button class="wd" data-un="${k}">${esc(t.ch)}</button>`).join(''):'<span class="muted">Tap the words below</span>'}</div>
      <div class="slots">${tiles.map(t=>`<button class="wd y" data-k="${t.k}" ${built.includes(t)?'disabled':''}>${esc(t.ch)}</button>`).join('')}</div>
      <button class="btn alt sm" data-a="skip">Show me</button></div>`)};
    draw();
    $('#app').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.a==='back')return go('games');
      if(b.dataset.a==='skip'){say(words.join(' '));toast(words.join(' '));i++;return setTimeout(show,1800)}
      if(b.dataset.k!=null){built.push(tiles.find(t=>t.k===+b.dataset.k));if(built.length===words.length){if(built.map(t=>t.ch).join(' ')===words.join(' ')){if(!tries)right++;say(words.join(' '));toast('Right!');i++;return setTimeout(show,900)}tries++;toast('Not yet. Try again.');built=[]}draw()}
      else if(b.dataset.un!=null){built.splice(+b.dataset.un);draw()}}};
  show()}
function gFind(){
  const set=shuffle(pool(9)).slice(0,9),order=shuffle(set),grid=shuffle(set);let i=0,miss=0;const t0=Date.now(),gone={};
  const draw=()=>{const x=order[i];R(gTop('Find the match','Tap the word that fits. Keep going until none are left.')+`<p class="muted" id="clock">0s</p>
    <div class="card" style="text-align:center">${img(x.pic)}<div class="vi" style="font-size:1.25rem;font-weight:700">${esc(mean(x))}</div></div>
    <div class="fgrid">${grid.map(y=>`<button class="mt c ${gone[y.w]?'gone':''}" data-w="${esc(y.w)}">${esc(y.w)}</button>`).join('')}</div>`)};
  draw();clearInterval(tick);tick=setInterval(()=>{const c=$('#clock');if(c)c.textContent=Math.round((Date.now()-t0)/1000)+'s'},500);
  $('#app').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.a==='back')return go('games');if(b.dataset.w==null||b.classList.contains('gone'))return;
    if(b.dataset.w===order[i].w){say(b.dataset.w);gone[b.dataset.w]=1;i++;if(i>=order.length){clearInterval(tick);const s=Math.round((Date.now()-t0)/1000);return endGame('find','All found',s+' seconds, '+miss+' misses.',s+'s',(a,o)=>parseInt(a)<parseInt(o),miss===0?3:miss<=2?2:1)}draw()}
    else{miss++;b.classList.add('no');setTimeout(()=>b.classList.remove('no'),400)}}}
function gFlash(){
  const list=shuffle(pool(8)).slice(0,15);let i=0,flip=false;
  const draw=()=>{const x=list[i];R(gTop('Flash cards','See it, say it, turn it over. No scores here.')+`<p class="muted">${i+1} of ${list.length}</p>
    <button class="card flash fc" data-a="flip">${flip?`${img(x.pic)}<div class="big">${esc(x.w)}</div><div class="vi">${esc(x.vi)}</div>${x.ex?`<div class="ex">${exHtml(x.ex)}</div>`:''}`:`${img(x.pic)}<div class="big">${esc(x.w)}</div><div class="muted">${esc(x.p)} · tap to turn over</div>`}</button>
    <div class="pair"><button class="btn alt" data-a="prev" ${i?'':'disabled'}>Back</button><button class="btn alt" data-a="hear">Listen</button><button class="btn" data-a="next">${i<list.length-1?'Next':'Done'}</button></div>`);};
  draw();say(list[0].w);
  $('#app').onclick=e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.a,x=list[i];
    if(a==='back')go('games');else if(a==='flip'){flip=!flip;draw();if(flip&&x.ex)say(exPlain(x.ex))}else if(a==='hear')say(x.w+'. '+exPlain(x.ex||''));
    else if(a==='prev'){i--;flip=false;draw();say(list[i].w)}else if(a==='next'){if(i>=list.length-1){D().gm=1;save();return go('games')}i++;flip=false;draw();say(list[i].w)}}}
function vGames(){const ds=decks();R(`<h2>Games</h2><div class="cap">Chọn bộ từ · Which words</div>
  <select id="gd"><option value="learned">Words I have learned (all decks until I know eight)</option>${GROUPS.map(g=>`<optgroup label="${g[1]}">${ds.filter(p=>grp(p)===g[0]).map(p=>`<option value="${p.id}" ${GD===p.id?'selected':''}>${p.t}</option>`).join('')}</optgroup>`).join('')}</select>
  <div class="grid" style="margin-top:14px">${gameTiles()}</div>`);
  $('#gd').onchange=e=>{GD=e.target.value};
  $('#app').onclick=e=>{const b=e.target.closest('button');if(b&&b.dataset.game)startGame(b.dataset.game)}}

/* ---------- speaking: go deeper + sounds ---------- */
function check(text){const low=' '+text.toLowerCase().replace(/[^a-z'\- ]/g,' ').replace(/\s+/g,' ')+' ',used=ALL().filter(x=>low.includes(' '+x.w.toLowerCase())).map(x=>x.w),basic=[];
  Object.keys(UPGRADE).forEach(b=>{if(low.includes(' '+b+' '))basic.push(b)});return {n:text.trim()?text.trim().split(/\s+/).length:0,used:[...new Set(used)],basic}}
function vSpeak(){
  R(`<h2>Speak</h2><p class="muted">For after your cards. Answer out loud, then talk about it with Ben.</p>
  <div class="card"><h3>When you are stuck</h3>${RESCUE.map(r=>`<div style="margin:6px 0"><button class="btn alt sm" data-say="${esc(r[0])}">▸</button> <b>${esc(r[0])}</b> <span class="vi">${esc(r[1])}</span></div>`).join('')}</div>
  <h2>Go deeper</h2><div class="grid">${TOPICS.map(t=>{const k=S.answers.filter(a=>a.t===t.id).length;return `<button class="tile" data-topic="${t.id}"><b>${t.t}</b><span>${esc(t.q[0])}</span><br><span>${k?k+' saved':'4 questions'}</span></button>`}).join('')}</div>
  <h2>Sounds</h2><div class="grid">${SOUNDS.map(s=>`<button class="tile" data-s="${s.id}"><b>${s.t}</b><span>${esc(s.en)}</span></button>`).join('')}</div>`);
  $('#app').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.say)say(b.dataset.say);else if(b.dataset.topic)vTalk(b.dataset.topic);else if(b.dataset.s)vSound(b.dataset.s)}}
function vTalk(tid){
  const t=TOPICS.find(x=>x.id===tid);let lv=0,model=false;
  const show=()=>{R(`<button class="back" data-a="back">‹ Speak</button><h2>${t.t}</h2>
    <div class="seg">${t.q.map((q,i)=>`<button class="${i===lv?'on':''}" data-lv="${i}">${['Easy','More','Deeper','Deepest'][i]}</button>`).join('')}</div>
    <div class="card"><div style="font-size:1.2rem;font-weight:600">${esc(t.q[lv])}</div><button class="btn alt sm" data-a="hear" style="margin-top:8px">Listen</button></div>
    <div class="card"><h3>Start with</h3>${t.f.map(f=>`<span class="chip">${esc(f)}</span>`).join('')}</div>
    <textarea id="ans" placeholder="Speak or type your answer. Three sentences or more."></textarea>
    <div class="row" style="margin-top:8px"><button class="btn alt" data-a="mic">Speak</button><button class="btn" data-a="check">Check my answer</button></div><div id="fb"></div>
    <div class="card"><button class="btn alt sm" data-a="model">${model?'Hide':'Show'} an example answer</button>${model?`<p>${esc(t.m)}</p><button class="btn alt sm" data-a="hearm">Listen</button>`:''}</div>`);
    $('#app').onclick=e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.a;
      if(a==='back')go('speak');else if(b.dataset.lv){lv=+b.dataset.lv;show()}else if(a==='hear')say(t.q[lv]);else if(a==='hearm')say(t.m);
      else if(a==='model'){const keep=$('#ans').value;model=!model;show();$('#ans').value=keep}
      else if(a==='mic')listen(tx=>{$('#ans').value=tx},b);
      else if(a==='check'){const tx=$('#ans').value.trim();if(!tx)return toast('Say or type something first.');const c=check(tx);
        $('#fb').innerHTML=`<div class="card"><b>${c.n} words</b> ${c.n<25?'<span class="muted">Try to add a reason: “because…”, “for instance…”</span>':'<span class="chip g">Good length</span>'}
        <p style="margin:8px 0 4px">New words you used: ${c.used.length?c.used.map(w=>`<span class="chip g">${esc(w)}</span>`).join(''):'<span class="muted">none yet</span>'}</p>
        ${c.basic.length?`<p style="margin:8px 0 4px">Try changing:</p>${c.basic.map(b=>`<div><span class="chip r">${esc(b)}</span> → ${UPGRADE[b].map(u=>`<span class="chip">${esc(u)}</span>`).join('')}</div>`).join('')}`:''}
        <div class="row" style="margin-top:10px"><button class="btn" data-a="save">Save for Ben</button><span class="muted">Or change it and check again.</span></div></div>`}
      else if(a==='save'){const tx=$('#ans').value.trim(),c=check(tx);S.answers.unshift({d:today(),t:t.id,q:t.q[lv],a:tx,n:c.n,u:c.used});D().tk=1;save();toast('Saved.');if(lv<3){lv++;show()}else go('speak')}}};
  show()}
function vSound(sid){
  const s=SOUNDS.find(x=>x.id===sid);let q=null,score=0,asked=0;
  const ask=()=>{const p=s.pairs[Math.floor(Math.random()*s.pairs.length)];q={p,a:p[Math.floor(Math.random()*2)]};say(q.a);draw()};
  const draw=(fb)=>{R(`<button class="back" data-a="back">‹ Speak</button><h2>${s.t}</h2>
    <div class="card"><p style="margin:0">${esc(s.en)}</p><p class="vi" style="margin:6px 0 0">${esc(s.vi)}</p></div>
    <div class="card"><h3>Listen and repeat</h3>${s.pairs?s.pairs.map(p=>`<div class="pair">${p.map(w=>`<button class="btn alt" data-say="${esc(w)}">${esc(w)}</button>`).join('')}</div>`).join('')
      :s.list.map(w=>`<div class="pair"><button class="btn alt" data-say="${esc(w[0])}">${esc(w[0])}</button><div style="flex:1;align-self:center" class="muted">${esc(w[1])}</div></div>`).join('')}</div>
    ${s.pairs?`<div class="card"><h3>Which one did you hear?</h3>${q?`<div class="pair">${q.p.map(w=>`<button class="btn alt" data-pick="${esc(w)}">${esc(w)}</button>`).join('')}</div><button class="btn alt sm" data-a="again">Hear it again</button>`:`<button class="btn" data-a="ask">Start</button>`}
      <p class="muted" style="margin:8px 0 0">${fb||''} ${asked?score+' of '+asked+' right':''}</p></div>`:''}
    <div class="card"><h3>Say this sentence</h3><p style="font-weight:600">${esc(s.say)}</p><div class="row"><button class="btn alt" data-say="${esc(s.say)}">Listen</button><button class="btn" data-a="mic">Speak</button></div><p id="heard" class="muted"></p></div>`);
    $('#app').onclick=e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.a;
      if(a==='back')go('speak');else if(b.dataset.say)say(b.dataset.say);else if(a==='ask')ask();else if(a==='again')say(q.a);
      else if(b.dataset.pick){asked++;const ok=b.dataset.pick===q.a;if(ok)score++;const was=q.a;q=null;draw(ok?'Right.':'It was “'+was+'”.');setTimeout(()=>{if($('[data-a=ask]'))ask()},900)}
      else if(a==='mic')listen(tx=>{const want=s.say.toLowerCase().replace(/[^a-z ]/g,'').split(' '),got=tx.toLowerCase().replace(/[^a-z ]/g,'').split(' ');
        $('#heard').innerHTML='I heard: '+want.map(w=>`<span class="chip ${got.includes(w)?'g':'r'}">${w}</span>`).join('')},b)}};
  draw()}

/* ---------- for Ben ---------- */
function vBen(){
  const name=id=>(TOPICS.find(t=>t.id===id)||{}).t||'';const fmt=d=>{const s=String(d);return s.slice(4,6)+'/'+s.slice(6)};
  const hard=ALL().filter(x=>S.cards[x.w]&&S.cards[x.w].n>=3&&S.cards[x.w].s<=1).map(x=>x.w);
  R(`<h2>For Ben</h2><div class="card"><h3>How to teach with this</h3><p class="muted" style="margin:0">1. When she reaches for a word in conversation and can't find it, add it here. It goes into her cards the same day. 2. Use her sticking words below in your own sentences. 3. Read her saved answers before you talk and push one level deeper.</p></div>
  <div class="card"><h3>Add a word for her</h3><input type="text" id="mw" placeholder="Word or phrase"><input type="text" id="mv" placeholder="Meaning (Vietnamese or simple English)" style="margin-top:8px"><input type="text" id="me" placeholder="Example sentence (optional)" style="margin-top:8px"><button class="btn" data-a="add" style="margin-top:8px">Add to her cards</button>
  ${S.mine.length?`<p class="muted" style="margin:10px 0 0">Added: ${S.mine.map(m=>esc(m.w)).join(', ')}</p>`:''}</div>
  <div class="card"><h3>Words that are not sticking</h3>${hard.length?hard.map(w=>`<span class="chip r">${esc(w)}</span>`).join(''):'<span class="muted">None yet. Words she keeps missing show up here.</span>'}</div>
  <div class="row sb"><h2 style="margin:10px 0">Her answers (${S.answers.length})</h2>${S.answers.length?'<button class="btn alt sm" data-a="copy">Copy all</button>':''}</div>
  ${S.answers.length?S.answers.map(a=>`<div class="card"><span class="muted">${fmt(a.d)} · ${esc(name(a.t))} · ${a.n} words</span><div style="font-weight:600;margin-top:4px">${esc(a.q)}</div><div class="ans">${esc(a.a)}</div>${(a.u||[]).map(w=>`<span class="chip g">${esc(w)}</span>`).join('')}</div>`).join(''):'<p class="muted">Nothing saved yet. Answers she saves in Speak show up here.</p>'}
  <p class="muted">In this version, cards and answers stay on the phone they were made on.</p>`);
  $('#app').onclick=e=>{const b=e.target.closest('button');if(!b)return;
    if(b.dataset.a==='add'){const w=$('#mw').value.trim(),v=$('#mv').value.trim(),x=$('#me').value.trim();if(!w||!v)return toast('Add the word and its meaning.');if(find(w))return toast('That word is already in her cards.');
      S.mine.push({w,vi:v,ex:x&&x.toLowerCase().includes(w.toLowerCase())?x.replace(new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'i'),m=>'{'+m+'}'):x});save();toast('Added.');vBen()}
    else if(b.dataset.a==='copy'){const tx=S.answers.map(a=>fmt(a.d)+' '+a.q+'\n'+a.a).join('\n\n');try{navigator.clipboard.writeText(tx).then(()=>toast('Copied.'),()=>toast('Copy did not work here.'))}catch(e){toast('Copy did not work here.')}}}}

$('#nav').onclick=e=>{const b=e.target.closest('button');if(b)go(b.dataset.go)};
try{speechSynthesis.getVoices()}catch(e){}
go('home');


</script>
