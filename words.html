<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Word list to check · Ben's Tiếng Việt</title>
<style>body{margin:0;background:#F3EADB;color:#2B1D14;font:16px/1.5 "Be Vietnam Pro",system-ui,sans-serif}main{max-width:860px;margin:0 auto;padding:24px 16px 60px}h1{font:700 30px Georgia,serif;margin:0 0 6px}h2{font:700 22px Georgia,serif;margin:32px 0 8px}p{color:#6A5544;margin:0 0 12px}table{width:100%;border-collapse:collapse;background:#FBF4E6;border:1.5px solid #CDBFA6}td{padding:8px 10px;border-top:1px solid #CDBFA6;vertical-align:top}td:first-child{font-weight:600;width:26%}td:nth-child(2){width:24%;color:#6A5544}.s{font-size:14px;color:#6A5544}@media print{body{background:#fff}}</style></head>
<body><main><h1>Danh sách từ · Word list to check</h1><p>These words were drafted for foreigners living in Saigon. Thầy ơi, please tell Ben which ones are wrong, sound too northern, or are missing. Levels 6 and up are new.</p><div id="out">Loading…</div></main>
<script>fetch('data/words13.json').then(function(r){return r.json()}).then(function(j){var o=document.getElementById('out');o.textContent='';j.levels.forEach(function(L){var h=document.createElement('h2');h.textContent='Level '+L.n+' · '+L.t+' ('+L.cards.length+')';o.appendChild(h);var t=document.createElement('table');L.cards.forEach(function(c){var r=t.insertRow();r.insertCell().textContent=c.vi;r.insertCell().textContent=c.en;var d=r.insertCell();d.textContent=c.xv;var s=document.createElement('div');s.className='s';s.textContent=c.xe;d.appendChild(s)});o.appendChild(t)})}).catch(function(){document.getElementById('out').textContent='Could not load the list.'})</script></body></html>
